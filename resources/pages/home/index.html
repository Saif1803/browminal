<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Home</title>
    <link rel="stylesheet" href="home.css" />
    <script src="home.js" defer></script>
  </head>
  <body>
    <main class="home">
      <h1 class="greeting" id="greeting">Hello</h1>

      <form class="prompt" id="prompt-form" autocomplete="off">
        <label class="visually-hidden" for="prompt">Your question</label>
        <textarea
          id="prompt"
          class="prompt-input"
          rows="1"
          placeholder="Ask anything"
          spellcheck="true"
          autofocus
        ></textarea>

        <div class="prompt-footer">
          <fieldset class="picker">
            <legend class="visually-hidden">Send to</legend>
            <!-- Slides under the chosen option (home.css). -->
            <span class="picker-thumb" aria-hidden="true"></span>
            <label class="picker-option">
              <input type="radio" name="assistant" value="chatgpt" checked />
              <span><img class="picker-icon" src="icons/chatgpt.svg" alt="" />ChatGPT</span>
            </label>
            <label class="picker-option">
              <input type="radio" name="assistant" value="claude" />
              <span><img class="picker-icon" src="icons/claude.svg" alt="" />Claude</span>
            </label>
            <label class="picker-option">
              <input type="radio" name="assistant" value="google" />
              <span><img class="picker-icon" src="icons/google.png" alt="" />Google</span>
            </label>
          </fieldset>

          <!-- Icon only; home.js names it for the chosen assistant (aria-label, tooltip). -->
          <button type="submit" class="ask" id="ask" aria-label="Ask ChatGPT">
            <svg
              class="ask-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4.2-4.2" />
            </svg>
          </button>
        </div>
      </form>

      <!-- Favourite sites: filled by home.js from localStorage, with an Add tile last. -->
      <nav class="shortcuts" id="shortcuts" aria-label="Favourite sites"></nav>

      <dialog class="dialog" id="add-dialog" aria-labelledby="add-title">
        <form class="dialog-form" id="add-form" autocomplete="off" novalidate>
          <h2 class="dialog-title" id="add-title">Add a site</h2>
          <label class="field">
            <span class="field-label">URL</span>
            <input class="field-input" id="add-url" maxlength="2048" placeholder="example.com" />
          </label>
          <label class="field">
            <span class="field-label">Name</span>
            <input class="field-input" id="add-name" maxlength="40" placeholder="Optional" />
          </label>
          <p class="dialog-error" id="add-error" role="alert"></p>
          <div class="dialog-actions">
            <button type="button" class="button" id="add-cancel">Cancel</button>
            <button type="submit" class="button button-primary">Add</button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
