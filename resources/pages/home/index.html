<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>Home</title>
    <link rel="stylesheet" href="home.css" />
    <!-- Empty unless the window is glass (see src/main/protocol.ts). -->
    <link rel="stylesheet" href="glass.css" />
    <script src="home.js" defer></script>
  </head>
  <body>
    <main class="home">
      <h1 class="greeting" id="greeting">Hello</h1>

      <form class="prompt" id="prompt-form" autocomplete="off">
        <label class="visually-hidden" for="prompt">Your question</label>
        <textarea
          id="prompt"
          class="prompt-input"
          rows="1"
          placeholder="Ask anything"
          spellcheck="true"
          autofocus
        ></textarea>

        <div class="prompt-footer">
          <fieldset class="picker">
            <legend class="visually-hidden">Send to</legend>
            <!-- Slides under the chosen option (home.css). -->
            <span class="picker-thumb" aria-hidden="true"></span>
            <label class="picker-option">
              <input type="radio" name="assistant" value="chatgpt" checked />
              <span>
                <img class="icon" src="icons/chatgpt.svg" alt="" />
                ChatGPT
              </span>
            </label>
            <label class="picker-option">
              <input type="radio" name="assistant" value="claude" />
              <span>
                <img class="icon" src="icons/claude.svg" alt="" />
                Claude
              </span>
            </label>
            <label class="picker-option">
              <input type="radio" name="assistant" value="google" />
              <span>
                <img class="icon" src="icons/google.png" alt="" />
                Google
              </span>
            </label>
          </fieldset>

          <button type="submit" class="ask" id="ask">Ask ChatGPT</button>
        </div>
      </form>

      <p class="hint" id="hint">Press Enter to ask, Shift+Enter for a new line</p>

      <nav class="shortcuts" aria-label="Quick links">
        <a class="shortcut" href="https://chatgpt.com/">
          <img class="shortcut-icon" src="icons/chatgpt.svg" alt="" />
          <span class="shortcut-text">
            <span class="shortcut-name">ChatGPT</span>
            <span class="shortcut-host">chatgpt.com</span>
          </span>
        </a>
        <a class="shortcut" href="https://claude.ai/new">
          <img class="shortcut-icon" src="icons/claude.svg" alt="" />
          <span class="shortcut-text">
            <span class="shortcut-name">Claude</span>
            <span class="shortcut-host">claude.ai</span>
          </span>
        </a>
        <a class="shortcut" href="https://www.google.com/">
          <img class="shortcut-icon" src="icons/google.png" alt="" />
          <span class="shortcut-text">
            <span class="shortcut-name">Google</span>
            <span class="shortcut-host">google.com</span>
          </span>
        </a>
      </nav>
    </main>
  </body>
</html>
