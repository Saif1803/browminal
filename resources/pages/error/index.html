<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>Page not loaded</title>
    <link rel="stylesheet" href="error.css" />
    <script src="error.js" defer></script>
  </head>
  <body>
    <main class="error">
      <h1 class="error-title" id="title">This page couldn't be loaded</h1>
      <p class="error-message" id="message"></p>
      <p class="error-code" id="code"></p>
      <button type="button" class="retry" id="retry" hidden>Try again</button>
    </main>
  </body>
</html>
