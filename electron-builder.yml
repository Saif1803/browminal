appId: com.browminal.browser
productName: Browminal
copyright: Copyright © 2026 Saif
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!src/*'
  - '!native/**'
  - '!scripts/**'
  - '!docs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,bun.lock,bunfig.toml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}'
asarUnpack:
  - resources/**
  # The native module (electron-vite copies it next to main's code); loaded from a real file.
  - out/main/**/*.node
win:
  executableName: browminal
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # No Developer ID yet: ad-hoc signed, which Apple Silicon needs to start an app at all. A
  # downloaded copy is still held back by Gatekeeper until the app is signed and notarised; then
  # remove `identity` and `hardenedRuntime` (the hardened runtime needs a real signature) and set
  # `notarize: true`.
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: A page you opened in Browminal wants to use the camera.
    - NSMicrophoneUsageDescription: A page you opened in Browminal wants to use the microphone.
    - NSLocationUsageDescription: A page you opened in Browminal wants to know your location.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  # AppImage only: a .deb needs the project's homepage, which comes with the public repository.
  target:
    - AppImage
  maintainer: Saif
  category: Network
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
# No update server yet: nothing is published and the app never checks for updates.
publish: null
